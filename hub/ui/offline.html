<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>StickHub</title>
<style>
  html, body { margin: 0; min-height: 100dvh; background: #000; color: #f2f2f2; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 18vh 20px 24px; text-align: center; }
  img { width: 88px; height: 88px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color: #8a8a8a; margin: 8px 0; }
  pre { background: #111; border: 1px solid #262626; border-radius: 12px; padding: 14px; color: #ffc247; white-space: pre-wrap; overflow-wrap: anywhere; text-align: left; }
  button { all: unset; display: block; margin: 22px auto 0; padding: 14px 28px; border-radius: 14px; background: #5df2a0; color: #002814; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Hub is not running</h1>
  <p>Tap the <b>StickHub</b> widget on your home screen, or in Termux run:</p>
  <pre>cd ~/StickHub &amp;&amp; node hub/cli.mjs open</pre>
  <p id="wait">This page opens the hub by itself when it is back.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  // Check every 3 s (only while this page is visible) and reload when the hub answers.
  setInterval(() => {
    if (document.hidden) return;
    fetch('/api/ping', { cache: 'no-store' }).then((r) => { if (r.ok) location.replace('/'); }).catch(() => {});
  }, 3000);
</script>
</body>
</html>
